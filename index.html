<!DOCTYPE html>
<html lang="ru" data-theme="sand">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Календарь жизни: выбранный горизонт в неделях. Прожитое закрашено, текущая неделя выделена, будущее ещё пусто.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Календарь">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Календарь жизни</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    try {
      var raw = localStorage.getItem("life-calendar.v1");
      if (raw) {
        var data = JSON.parse(raw);
        var allowed = { sand: 1, ink: 1, dusk: 1, moss: 1, ember: 1 };
        if (data && allowed[data.theme]) {
          document.documentElement.setAttribute("data-theme", data.theme);
          var dark = data.theme === "dusk" || data.theme === "ember";
          var color = dark ? "#14131a" : "#f3eee4";
          if (data.theme === "ink") color = "#f3f1eb";
          if (data.theme === "moss") color = "#eef2e8";
          if (data.theme === "ember") color = "#141211";
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (themeMeta) themeMeta.setAttribute("content", color);
          if (bar) bar.setAttribute("content", dark ? "black" : "default");
        }
      }
    } catch (e) {}
  </script>
  <style>
    :root, [data-theme="sand"] {
      color-scheme: light;
      --paper: #f3eee4; --paper-raised: #faf6ee; --ink: #2c261f; --ink-soft: #6f6458; --ink-faint: #9a8d7e;
      --line: rgba(44, 38, 31, 0.1); --line-strong: rgba(44, 38, 31, 0.22);
      --sand: #c6a56d; --sand-deep: #9a743c; --current: #8d4e2b; --current-soft: rgba(141, 78, 43, 0.14);
      --future: rgba(44, 38, 31, 0.2); --note-dot: #2c261f; --veil: rgba(44, 38, 31, 0.46);
      --shadow: 0 30px 70px rgba(44, 38, 31, 0.12); --glow: rgba(198, 165, 109, 0.45); --glass: rgba(44, 38, 31, 0.62);
    }
    [data-theme="ink"] {
      color-scheme: light;
      --paper: #f3f1eb; --paper-raised: #fbfaf7; --ink: #1b2433; --ink-soft: #5c6778; --ink-faint: #8b93a1;
      --line: rgba(27, 36, 51, 0.1); --line-strong: rgba(27, 36, 51, 0.22);
      --sand: #3d5a86; --sand-deep: #2a4268; --current: #1c2c49; --current-soft: rgba(28, 44, 73, 0.12);
      --future: rgba(27, 36, 51, 0.2); --note-dot: #1c2c49; --veil: rgba(18, 24, 36, 0.48);
      --shadow: 0 30px 70px rgba(27, 36, 51, 0.12); --glow: rgba(61, 90, 134, 0.2); --glass: rgba(27, 36, 51, 0.6);
    }
    [data-theme="dusk"] {
      color-scheme: dark;
      --paper: #14131a; --paper-raised: #1d1b24; --ink: #f4eee4; --ink-soft: #c3b6a4; --ink-faint: #8f8476;
      --line: rgba(244, 238, 228, 0.1); --line-strong: rgba(244, 238, 228, 0.24);
      --sand: #d4b483; --sand-deep: #e7d0a4; --current: #f6e6c8; --current-soft: rgba(246, 230, 200, 0.12);
      --future: rgba(244, 238, 228, 0.24); --note-dot: #f6e6c8; --veil: rgba(0, 0, 0, 0.64);
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.45); --glow: rgba(212, 180, 131, 0.16); --glass: rgba(244, 238, 228, 0.55);
    }
    [data-theme="moss"] {
      color-scheme: light;
      --paper: #eef2e8; --paper-raised: #f7f8f2; --ink: #243024; --ink-soft: #5d6b58; --ink-faint: #8b9784;
      --line: rgba(36, 48, 36, 0.1); --line-strong: rgba(36, 48, 36, 0.22);
      --sand: #739066; --sand-deep: #567350; --current: #2f4a34; --current-soft: rgba(47, 74, 52, 0.12);
      --future: rgba(36, 48, 36, 0.22); --note-dot: #243024; --veil: rgba(28, 38, 28, 0.46);
      --shadow: 0 30px 70px rgba(36, 48, 36, 0.12); --glow: rgba(115, 144, 102, 0.28); --glass: rgba(36, 48, 36, 0.58);
    }
    [data-theme="ember"] {
      color-scheme: dark;
      --paper: #141211; --paper-raised: #1e1a17; --ink: #f6efe6; --ink-soft: #d2c0ae; --ink-faint: #9a8878;
      --line: rgba(246, 239, 230, 0.1); --line-strong: rgba(246, 239, 230, 0.24);
      --sand: #d49264; --sand-deep: #e4b48f; --current: #f3d7be; --current-soft: rgba(243, 215, 190, 0.12);
      --future: rgba(246, 239, 230, 0.24); --note-dot: #f3d7be; --veil: rgba(0, 0, 0, 0.66);
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.5); --glow: rgba(212, 146, 100, 0.18); --glass: rgba(246, 239, 230, 0.5);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Manrope, system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: 0.45; }
    :focus-visible { outline: 2px solid var(--current); outline-offset: 2px; }
    ::selection { background: var(--current-soft); color: var(--ink); }
    .vignette {
      pointer-events: none; position: fixed; inset: 0;
      background:
        radial-gradient(920px 520px at 0% -10%, var(--glow), transparent 62%),
        radial-gradient(720px 460px at 100% 0%, var(--glow), transparent 58%);
    }
    .wrap { width: min(1120px, calc(100% - 2rem)); margin: 0 auto; padding: 1.25rem 0 3rem; position: relative; }
    .kicker { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); }
    .serif { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: clamp(2.4rem, 5vw, 4.2rem); line-height: 0.95; margin: 0.35rem 0 0.6rem; }
    .quote { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: clamp(1.35rem, 2.4vw, 1.85rem); line-height: 1.25; margin: 0; }
    .soft { color: var(--ink-soft); }
    .faint { color: var(--ink-faint); }
    .panel {
      border: 1px solid var(--line); border-radius: 1.5rem;
      background: color-mix(in srgb, var(--paper-raised) 88%, transparent);
      padding: 1.1rem 1.15rem 1.2rem;
    }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .btn {
      border: 1px solid transparent; border-radius: 999px; background: var(--ink); color: var(--paper);
      padding: 0.7rem 1.15rem; font-weight: 600;
    }
    .btn.small { padding: 0.4rem 0.8rem; font-size: 0.875rem; font-weight: 600; }
    .btn.ghost { background: transparent; color: var(--ink); border-color: transparent; }
    .btn.line { background: transparent; color: var(--ink); border-color: var(--line-strong); }
    .btn[aria-pressed="true"] { background: var(--current-soft); border-color: var(--current); }
    .field { display: flex; flex-direction: column; gap: 0.35rem; }
    label span, .field > span { font-size: 0.92rem; }
    input[type="text"], input[type="date"], input[type="number"], textarea, input[type="search"] {
      width: 100%; border: 1px solid var(--line-strong); border-radius: 0.9rem;
      background: var(--paper-raised); padding: 0.7rem 0.8rem;
    }
    textarea { min-height: 7rem; resize: vertical; }
    .error { color: var(--current); margin: 0; }
    .invite { display: grid; gap: 1.5rem; align-items: center; }
    @media (min-width: 800px) {
      .invite { grid-template-columns: 1.2fr 0.8fr; }
    }
    .hourglass { width: min(220px, 70%); height: auto; display: block; margin: 0 auto; }
    .grain { transform-box: fill-box; transform-origin: center; animation: fall 1.8s linear infinite; }
    .grain-delay { animation-delay: 0.55s; }
    .grain-delay-2 { animation-delay: 1.05s; }
    @keyframes fall {
      0% { transform: translateY(0); opacity: 0; }
      18% { opacity: 1; }
      100% { transform: translateY(18px); opacity: 0; }
    }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-top: 1rem; }
    .stat { border-top: 1px solid var(--line); padding-top: 0.45rem; }
    .stat b { display: block; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--ink-soft); font-size: 0.78rem; }
    .themes { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .swatch {
      width: 100%; border: 1px solid var(--line); border-radius: 999px; background: transparent;
      padding: 0.35rem 0.7rem 0.35rem 0.35rem; display: flex; gap: 0.45rem; align-items: center;
    }
    .swatch[aria-pressed="true"] { border-color: var(--current); background: var(--current-soft); }
    .dots { display: flex; }
    .dots i { width: 0.85rem; height: 0.85rem; border-radius: 99px; display: block; margin-left: -0.25rem; border: 1px solid var(--paper); }
    .dots i:first-child { margin-left: 0; }
    .layout { display: grid; gap: 1.25rem; min-width: 0; grid-template-columns: minmax(0, 1fr); }
    .layout > * { min-width: 0; max-width: 100%; }
    @media (min-width: 960px) {
      .layout { grid-template-columns: 280px minmax(0, 1fr); align-items: start; }
      .aside { position: sticky; top: 1rem; }
    }
    .top { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-end; margin-bottom: 1rem; }
    .life-canvas { display: none; width: 100%; touch-action: manipulation; }
    .week-grid { --cell: 0.78rem; --gap: 2px; width: 100%; max-width: 100%; min-width: 0; }
    .week-grid.is-phone .life-canvas { display: block; }
    .week-grid.is-phone .ruler,
    .week-grid.is-phone #calendar { display: none; }
    .week-grid.is-phone .grid-scroll {
      overflow: visible; max-height: none; border: none; background: transparent; padding: 0;
    }
    .week-grid[data-density="decade"] { --cell: 1.28rem; }
    .grid-scroll {
      position: relative; width: 100%; max-width: 100%; min-width: 0;
      overflow: auto; max-height: min(70vh, 760px); padding: 0.35rem 0.2rem 0.8rem;
      border-radius: 1.25rem; border: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper-raised) 65%, transparent);
      overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    }
    @media (max-width: 899px) {
      .grid-scroll { max-height: none; overflow-x: auto; overflow-y: hidden; }
      .week-grid { --cell: 0.55rem; }
      .week-grid[data-density="decade"] { --cell: 0.7rem; }
      .btn.small { padding: 0.38rem 0.7rem; }
      .wrap { padding-bottom: calc(2rem + env(safe-area-inset-bottom)); }
    }
    .ruler, .week-row {
      display: grid;
      grid-template-columns: 2.35rem repeat(52, minmax(var(--cell), 1fr));
      gap: var(--gap);
      width: max(100%, calc(2.35rem + (52 * var(--cell)) + (51 * var(--gap))));
    }
    .ruler {
      position: sticky; top: 0; z-index: 3; margin-bottom: 0.35rem; padding-bottom: 0.3rem;
      background: var(--paper); color: var(--ink-faint); font-size: 0.65rem; font-variant-numeric: tabular-nums;
    }
    .year-label {
      position: sticky; left: 0; z-index: 2; display: flex; align-items: center; justify-content: flex-end;
      padding-right: 0.35rem; background: var(--paper); color: var(--ink-faint); font-size: 0.68rem;
      font-variant-numeric: tabular-nums;
    }
    .year-label.is-decade, .week-row.is-now .year-label { color: var(--ink); font-weight: 600; }
    .week-row.is-now { background: linear-gradient(90deg, var(--current-soft), transparent 18%); }
    .week-cell {
      position: relative; display: block; width: 100%; aspect-ratio: 1; padding: 0;
      border: 1px solid var(--future); border-radius: 2px; background: transparent;
    }
    .week-cell.is-past { border-color: transparent; background: var(--sand); }
    .week-cell.is-current {
      z-index: 1; border-color: transparent; background: var(--current);
      box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--current);
    }
    .week-cell.is-selected:not(.is-current) { box-shadow: inset 0 0 0 1.5px var(--ink); }
    .week-cell.has-note::after {
      content: ""; position: absolute; top: 50%; left: 50%; width: 3px; height: 3px; border-radius: 99px;
      background: var(--note-dot); transform: translate(-50%, -50%);
    }
    .week-cell.is-past.has-note::after, .week-cell.is-current.has-note::after { background: var(--paper); }
    .week-cell.is-dim { opacity: 0.18; }
    .stage-label {
      position: sticky; left: 0; width: fit-content; margin: 0.9rem 0 0.35rem;
      color: var(--ink-soft); font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.15rem; font-style: italic;
    }
    .overlay {
      position: fixed; inset: 0; z-index: 20; background: var(--veil);
      display: grid; place-items: center; padding: 1rem;
    }
    .dialog {
      width: min(36rem, 100%); max-height: calc(100dvh - 2rem); overflow: auto;
      background: var(--paper-raised); color: var(--ink); border-radius: 1.4rem;
      box-shadow: var(--shadow); padding: 1.2rem 1.2rem 1.3rem;
    }
    .dialog h2 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 2rem; font-weight: 500; margin: 0 0 0.35rem; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .journal-list { display: flex; flex-direction: column; gap: 0.45rem; margin-top: 0.8rem; }
    .journal-item {
      text-align: left; border: 1px solid var(--line); border-radius: 1rem; background: transparent;
      padding: 0.7rem 0.8rem;
    }
    .journal-item b { display: block; font-weight: 600; }
    [data-contemplation="true"] .chrome,
    [data-contemplation="true"] .aside,
    [data-contemplation="true"] .quiet { display: none; }
    .contemplation-only { display: none; }
    [data-contemplation="true"] .contemplation-only { display: block; margin-bottom: 0.8rem; }
    @media (hover: hover) and (pointer: fine) {
      .week-cell:hover { z-index: 2; transform: scale(1.28); }
    }
    @media (hover: none), (pointer: coarse) {
      .grain, button.week-cell.is-current { animation: none; }
      .week-cell:hover { transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .grain, .week-cell.is-current { animation: none; }
      .week-cell:hover { transform: none; }
    }
    @media (prefers-reduced-motion: no-preference) {
      button.week-cell.is-current { animation: pulse-week 2.8s ease-in-out infinite; }
    }
    @keyframes pulse-week {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.16); }
    }
  </style>
</head>
<body>
  <div class="vignette"></div>
  <div class="wrap" id="app"></div>
  <script>
    "use strict";

    var WEEKS = 52;
    var KEY = "life-calendar.v1";
    var PRESETS = [70, 80, 90, 100];
    var THEMES = [
      { id: "sand", name: "Песок", swatch: ["#f4efe4", "#c6a56d", "#8c4e2a"] },
      { id: "ink", name: "Чернила", swatch: ["#f4f2ec", "#35507a", "#1c2c49"] },
      { id: "dusk", name: "Сумерки", swatch: ["#16141c", "#d7b98a", "#f4ead8"] },
      { id: "moss", name: "Мох", swatch: ["#eef2e8", "#6f835c", "#2d3a2b"] },
      { id: "ember", name: "Уголь", swatch: ["#141211", "#d49264", "#f3d7be"] }
    ];
    var TAGS = [
      { id: "joy", label: "Радость" },
      { id: "love", label: "Близость" },
      { id: "work", label: "Дело" },
      { id: "health", label: "Здоровье" },
      { id: "travel", label: "Путь" },
      { id: "milestone", label: "Рубеж" },
      { id: "loss", label: "Утрата" },
      { id: "intention", label: "Намерение" }
    ];
    var STAGES = [
      { id: "childhood", label: "Детство", from: 0, to: 13 },
      { id: "youth", label: "Юность", from: 13, to: 20 },
      { id: "rising", label: "Становление", from: 20, to: 35 },
      { id: "maturity", label: "Зрелость", from: 35, to: 50 },
      { id: "experience", label: "Опыт", from: 50, to: 65 },
      { id: "later", label: "Поздние годы", from: 65, to: 121 }
    ];
    var MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
    var QUOTE = "Ты не можешь остановить время. Но можешь решить, чем наполнить оставшиеся недели.";
    var TAG_IDS = {};
    TAGS.forEach(function (tag) { TAG_IDS[tag.id] = true; });

    var app = document.getElementById("app");
    var profile = loadProfile();
    var draft = { name: "", birth: "", horizon: 90, theme: "sand" };
    var decadeStart = 0;
    var dimEmpty = false;
    var contemplation = false;
    var selected = null;
    var saveWarning = "";
    var gridState = {
      years: [],
      birth: null,
      currentIndex: -1,
      rowH: 16,
      stageH: 34,
      measured: [],
      start: -1,
      end: -1,
      ticking: false
    };

    function esc(value) {
      return String(value).replace(/[&<>"']/g, function (char) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char];
      });
    }

    function plural(value, one, few, many) {
      var abs = Math.abs(Math.trunc(value));
      var mod10 = abs % 10;
      var mod100 = abs % 100;
      if (mod10 === 1 && mod100 !== 11) return one;
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return few;
      return many;
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("ru-RU").format(value);
    }

    function weeksLabel(value) {
      return formatNumber(value) + " " + plural(value, "неделя", "недели", "недель");
    }

    function yearsLabel(value) {
      return formatNumber(value) + " " + plural(value, "год", "года", "лет");
    }

    function parseISODate(value) {
      var match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
      if (!match) return null;
      var year = Number(match[1]);
      var month = Number(match[2]);
      var day = Number(match[3]);
      var date = new Date(year, month - 1, day);
      if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return null;
      return date;
    }

    function toISODate(date) {
      var month = String(date.getMonth() + 1).padStart(2, "0");
      var day = String(date.getDate()).padStart(2, "0");
      return date.getFullYear() + "-" + month + "-" + day;
    }

    function daysBetween(from, to) {
      var start = Date.UTC(from.getFullYear(), from.getMonth(), from.getDate());
      var end = Date.UTC(to.getFullYear(), to.getMonth(), to.getDate());
      return Math.round((end - start) / 86400000);
    }

    function addDays(date, days) {
      var next = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      next.setDate(next.getDate() + days);
      return next;
    }

    function ageParts(birth, today) {
      var years = today.getFullYear() - birth.getFullYear();
      var months = today.getMonth() - birth.getMonth();
      var days = today.getDate() - birth.getDate();
      if (days < 0) {
        months -= 1;
        days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }
      return { years: Math.max(0, years), months: Math.max(0, months), days: Math.max(0, days) };
    }

    function formatAge(age) {
      if (age.years === 0 && age.months === 0 && age.days === 0) return "День рождения";
      if (age.years === 0 && age.months === 0) return age.days + " " + plural(age.days, "день", "дня", "дней");
      var parts = [];
      if (age.years > 0) parts.push(yearsLabel(age.years));
      if (age.months > 0) parts.push(age.months + " " + plural(age.months, "месяц", "месяца", "месяцев"));
      if (age.days > 0) parts.push(age.days + " " + plural(age.days, "день", "дня", "дней"));
      if (parts.length <= 1) return parts[0] || "0 дней";
      if (parts.length === 2) return parts[0] + " и " + parts[1];
      return parts[0] + ", " + parts[1] + " и " + parts[2];
    }

    function formatShort(date) {
      return String(date.getDate()).padStart(2, "0") + "." + String(date.getMonth() + 1).padStart(2, "0") + "." + date.getFullYear();
    }

    function formatRange(start, end) {
      var sameYear = start.getFullYear() === end.getFullYear();
      var sameMonth = sameYear && start.getMonth() === end.getMonth();
      if (sameMonth) return start.getDate() + "–" + end.getDate() + " " + MONTHS[start.getMonth()] + " " + start.getFullYear();
      var left = start.getDate() + " " + MONTHS[start.getMonth()];
      var right = end.getDate() + " " + MONTHS[end.getMonth()];
      if (sameYear) return left + " — " + right + " " + end.getFullYear();
      return left + " " + start.getFullYear() + " — " + right + " " + end.getFullYear();
    }

    function weekRange(birth, index) {
      var start = addDays(birth, index * 7);
      return { start: start, end: addDays(start, 6) };
    }

    function stateOf(index, currentIndex) {
      if (currentIndex < 0 || index > currentIndex) return "future";
      if (index === currentIndex) return "current";
      return "past";
    }

    function stateLabel(state) {
      if (state === "past") return "Прожита";
      if (state === "current") return "Эта неделя";
      return "Впереди";
    }

    function stageForYear(year) {
      for (var i = 0; i < STAGES.length; i += 1) {
        if (year >= STAGES[i].from && year < STAGES[i].to) return STAGES[i];
      }
      return STAGES[STAGES.length - 1];
    }

    function buildModel(birth, today, horizonYears) {
      var horizon = Number.isInteger(horizonYears) ? Math.min(120, Math.max(1, horizonYears)) : 100;
      var horizonWeeks = horizon * WEEKS;
      var days = daysBetween(birth, today);
      var currentIndex = days < 0 ? -1 : Math.floor(days / 7);
      var livedRows = currentIndex < 0 ? 1 : Math.floor(currentIndex / WEEKS) + 1;
      var displayYears = Math.min(120, Math.max(horizon, livedRows));
      var pastWeeks = currentIndex <= 0 ? 0 : Math.min(currentIndex, horizonWeeks);
      var currentInside = currentIndex >= 0 && currentIndex < horizonWeeks;
      var futureWeeks = Math.max(0, horizonWeeks - pastWeeks - (currentInside ? 1 : 0));
      return {
        birth: birth,
        today: today,
        age: days < 0 ? { years: 0, months: 0, days: 0 } : ageParts(birth, today),
        currentIndex: currentIndex,
        horizonYears: horizon,
        horizonWeeks: horizonWeeks,
        displayYears: displayYears,
        pastWeeks: pastWeeks,
        futureWeeks: futureWeeks,
        currentInside: currentInside,
        extended: displayYears > horizon,
        pastRatio: pastWeeks / horizonWeeks,
        futureRatio: futureWeeks / horizonWeeks
      };
    }

    function validateBirth(value, today) {
      if (!value) return "Введите дату рождения.";
      var date = parseISODate(value);
      if (!date) return "Такой даты не существует.";
      if (daysBetween(date, today) < 0) return "Эта дата ещё не наступила.";
      if (ageParts(date, today).years > 120) return "Календарь ведётся в пределах 120 лет.";
      return "";
    }

    function remainingPhrase(futureWeeks) {
      if (futureWeeks <= 0) return "Выбранный горизонт уже заполнен. Рамку можно отодвинуть: это масштаб, а не срок.";
      var years = Math.floor(futureWeeks / 52);
      var weeks = futureWeeks % 52;
      if (years === 0) return "Внутри горизонта ещё " + weeksLabel(weeks) + ".";
      if (weeks === 0) return "Внутри горизонта ещё примерно " + yearsLabel(years) + ".";
      return "Внутри горизонта ещё примерно " + yearsLabel(years) + " и " + weeksLabel(weeks) + ".";
    }

    function emptyProfile(input) {
      return {
        kind: "life-calendar",
        version: 1,
        name: input.name.trim().slice(0, 40),
        birthDate: input.birthDate,
        horizonYears: input.horizonYears,
        theme: input.theme,
        notes: {},
        showStages: true,
        view: window.innerWidth < 800 ? "decade" : "life"
      };
    }

    function parseNote(value) {
      if (!value || typeof value !== "object") return null;
      var text = typeof value.text === "string" ? value.text.slice(0, 2000) : "";
      var tag = typeof value.tag === "string" && TAG_IDS[value.tag] ? value.tag : "";
      if (!text.trim() && !tag) return null;
      return {
        text: text,
        tag: tag || undefined,
        updatedAt: typeof value.updatedAt === "string" && value.updatedAt ? value.updatedAt : new Date(0).toISOString()
      };
    }

    function parseNotes(value) {
      var notes = {};
      if (!value || typeof value !== "object") return notes;
      Object.keys(value).forEach(function (key) {
        var match = /^(\d{1,3})-(\d{1,2})$/.exec(key);
        if (!match) return;
        var year = Number(match[1]);
        var week = Number(match[2]);
        if (year > 119 || week > 51) return;
        var note = parseNote(value[key]);
        if (note) notes[key] = note;
      });
      return notes;
    }

    function parseProfile(value) {
      if (!value || typeof value !== "object") return null;
      if (value.kind !== undefined && value.kind !== "life-calendar") return null;
      if (typeof value.birthDate !== "string" || !parseISODate(value.birthDate)) return null;
      if (typeof value.horizonYears !== "number" || !Number.isInteger(value.horizonYears)) return null;
      if (value.horizonYears < 1 || value.horizonYears > 120) return null;
      var theme = THEMES.some(function (item) { return item.id === value.theme; }) ? value.theme : "sand";
      return {
        kind: "life-calendar",
        version: 1,
        name: typeof value.name === "string" ? value.name.trim().slice(0, 40) : "",
        birthDate: value.birthDate,
        horizonYears: value.horizonYears,
        theme: theme,
        notes: parseNotes(value.notes),
        showStages: value.showStages !== false,
        view: value.view === "decade" ? "decade" : "life"
      };
    }

    function loadProfile() {
      try {
        var raw = localStorage.getItem(KEY);
        if (!raw) return null;
        return parseProfile(JSON.parse(raw));
      } catch (error) {
        return null;
      }
    }

    function persist() {
      try {
        localStorage.setItem(KEY, JSON.stringify(profile));
        saveWarning = "";
        return true;
      } catch (error) {
        saveWarning = "Браузер не сохранил календарь. Выгрузите его в файл из настроек.";
        return false;
      }
    }

    function today() {
      var now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function modelOf(source) {
      return buildModel(parseISODate(source.birthDate), today(), source.horizonYears);
    }

    function hourglass(pastRatio, futureRatio, flowing) {
      var past = Math.min(1, Math.max(0, pastRatio));
      var future = Math.min(1, Math.max(0, futureRatio));
      var futureHeight = future * 102;
      var pastHeight = past * 102;
      var grains = flowing
        ? '<g fill="var(--sand-deep)"><circle class="grain" cx="100" cy="140" r="1.7"></circle><circle class="grain grain-delay" cx="100" cy="140" r="1.35"></circle><circle class="grain grain-delay-2" cx="100" cy="140" r="1.1"></circle></g>'
        : "";
      return '<svg class="hourglass" viewBox="0 0 200 300" aria-hidden="true"><defs><clipPath id="hg-upper"><path d="M38 36h124c0 0-6 58-48 90-8 6-14 12-14 12s-6-6-14-12C44 94 38 36 38 36Z"></path></clipPath><clipPath id="hg-lower"><path d="M100 162s-6 6-14 12c-42 32-48 90-48 90h124c0 0-6-58-48-90-8-6-14-12-14-12Z"></path></clipPath><linearGradient id="hg-up" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="var(--sand-deep)"></stop><stop offset="100%" stop-color="var(--sand)"></stop></linearGradient><linearGradient id="hg-low" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--sand)"></stop><stop offset="100%" stop-color="var(--sand-deep)"></stop></linearGradient></defs><g clip-path="url(#hg-upper)"><rect x="0" y="' + (138 - futureHeight) + '" width="200" height="' + (futureHeight + 0.5) + '" fill="url(#hg-up)"></rect></g><g clip-path="url(#hg-lower)"><rect x="0" y="' + (264 - pastHeight) + '" width="200" height="' + (pastHeight + 0.5) + '" fill="url(#hg-low)"></rect></g>' + grains + '<path d="M38 36h124c0 0-6 58-48 90-8 6-12 14-12 18 0 4 4 12 12 18 42 32 48 90 48 90H38c0 0 6-58 48-90 8-6 12-14 12-18 0-4-4-12-12-18C44 94 38 36 38 36Z" fill="none" stroke="var(--glass)" stroke-width="1.7"></path></svg>';
    }

    function themeButtons(current) {
      return THEMES.map(function (theme) {
        var dots = theme.swatch.map(function (color) {
          return '<i style="background:' + color + '"></i>';
        }).join("");
        return '<button type="button" class="swatch" data-action="theme" data-theme="' + theme.id + '" aria-pressed="' + (theme.id === current) + '"><span class="dots">' + dots + '</span>' + esc(theme.name) + '</button>';
      }).join("");
    }

    function statsHtml(model) {
      return '<div class="stats"><div class="stat"><b>' + esc(formatAge(model.age)) + '</b><span>возраст</span></div><div class="stat"><b>' + esc(formatNumber(model.pastWeeks)) + '</b><span>прожито недель</span></div><div class="stat"><b>' + esc(formatNumber(model.futureWeeks)) + '</b><span>впереди до горизонта</span></div></div>';
    }

    function showInvite() {
      contemplation = false;
      app.dataset.contemplation = "false";
      app.innerHTML = '<section class="invite"><div><p class="kicker">Календарь жизни</p><h1>Вся жизнь помещается в одну сетку.</h1><p class="quote">«' + QUOTE + '»</p><p class="soft">Каждая клетка — одна неделя. Прожитые закрашены, текущая выделена, будущие ждут. Горизонт — рамка, которую выбираете вы.</p><p><button class="btn" type="button" data-action="open-form">Собрать свой календарь</button></p></div><div class="panel">' + hourglass(0.42, 0.58, true) + '</div></section>';
    }

    function showForm() {
      var custom = PRESETS.indexOf(draft.horizon) === -1;
      var presets = PRESETS.map(function (years) {
        return '<button type="button" class="btn small line" data-action="horizon" data-years="' + years + '" aria-pressed="' + (!custom && draft.horizon === years) + '">' + years + '</button>';
      }).join("");
      app.innerHTML = '<section><p class="kicker">Персонализация</p><h1>С чего начинается отсчёт</h1><form id="setup" class="panel" style="display:grid;gap:1rem"><div class="field"><label for="name">Имя, если хотите</label><input id="name" name="name" type="text" maxlength="40" autocomplete="given-name" value="' + esc(draft.name) + '" placeholder="Можно оставить пустым"></div><div class="field"><label for="birth">Дата рождения</label><input id="birth" name="birth" type="date" max="' + toISODate(today()) + '" value="' + esc(draft.birth) + '"></div><div class="field"><span>Горизонт</span><div class="row">' + presets + '<button type="button" class="btn small line" data-action="horizon-custom" aria-pressed="' + custom + '">Своё</button></div>' + (custom ? '<input name="custom" type="number" min="1" max="120" step="1" inputmode="numeric" value="' + esc(String(draft.horizon)) + '" aria-label="Свой горизонт в годах">' : '') + '<p class="faint" style="margin:0">70, 80, 90, 100 или число от 1 до 120. Это масштаб сетки.</p></div><div class="field"><span>Тема</span><div class="themes">' + themeButtons(draft.theme) + '</div></div><div id="live"></div><p id="form-error" class="error" role="alert"></p><div><button class="btn" type="submit">Открыть календарь</button> <button class="btn ghost" type="button" data-action="back-invite">Назад</button></div></form></section>';
      refreshLive();
    }

    function refreshLive() {
      var live = document.getElementById("live");
      if (!live) return;
      var error = validateBirth(draft.birth, today());
      if (error || !Number.isInteger(draft.horizon)) {
        live.innerHTML = '<p class="soft" style="margin:0">После даты здесь появятся возраст и недели.</p>';
        return;
      }
      var model = buildModel(parseISODate(draft.birth), today(), draft.horizon);
      live.innerHTML = statsHtml(model) + '<p class="soft">' + esc(remainingPhrase(model.futureWeeks)) + '</p>';
    }

    function readDraftFromForm() {
      var form = document.getElementById("setup");
      if (!form) return;
      draft.name = form.name.value;
      draft.birth = form.birth.value;
      if (form.custom) {
        var raw = form.custom.value.trim();
        var custom = Number(raw);
        draft.horizon = raw && Number.isInteger(custom) && custom >= 1 && custom <= 120 ? custom : NaN;
      }
    }

    function submitForm() {
      readDraftFromForm();
      var error = validateBirth(draft.birth, today());
      var horizonError = !Number.isInteger(draft.horizon) || draft.horizon < 1 || draft.horizon > 120;
      var box = document.getElementById("form-error");
      if (error || horizonError) {
        if (box) box.textContent = error || "Горизонт — целое число от 1 до 120.";
        return;
      }
      profile = emptyProfile({
        name: draft.name,
        birthDate: draft.birth,
        horizonYears: draft.horizon,
        theme: draft.theme
      });
      document.documentElement.setAttribute("data-theme", profile.theme);
      decadeStart = decadeOfCurrent();
      persist();
      renderCalendar(true);
    }

    function decadeOfCurrent() {
      var model = modelOf(profile);
      var year = model.currentIndex < 0 ? 0 : Math.floor(model.currentIndex / WEEKS);
      return Math.floor(year / 10) * 10;
    }

    function visibleYears(model) {
      var years = [];
      var start = 0;
      var end = model.displayYears;
      if (profile.view === "decade") {
        var maxStart = Math.max(0, Math.floor((model.displayYears - 1) / 10) * 10);
        decadeStart = Math.min(maxStart, Math.max(0, decadeStart));
        start = decadeStart;
        end = Math.min(model.displayYears, decadeStart + 10);
      }
      for (var year = start; year < end; year += 1) years.push(year);
      return years;
    }

    function gridHtml(model) {
      var years = visibleYears(model);
      gridState.years = years;
      gridState.birth = model.birth;
      gridState.currentIndex = model.currentIndex;
      gridState.measured = [];
      gridState.start = -1;
      gridState.end = -1;
      gridState.rowH = window.innerWidth < 900 ? 14 : 16;
      return '<div class="week-grid' + (phoneLayout() && profile.view === "life" ? " is-phone" : "") + '" data-density="' + (profile.view === "decade" ? "decade" : "life") + '"><div class="grid-scroll" id="grid-scroll"><canvas id="life-canvas" class="life-canvas" aria-label="Недели жизни"></canvas><div class="ruler" aria-hidden="true"><span></span><span style="grid-column:2">1</span><span style="grid-column:14">13</span><span style="grid-column:27">26</span><span style="grid-column:40">39</span><span style="grid-column:53">52</span></div><div id="calendar" role="grid" aria-label="Недели жизни"><div id="grid-pad-top"></div><div id="grid-rows"></div><div id="grid-pad-bottom"></div></div></div><p class="soft quiet">Строка — год жизни, клетка — неделя. Стрелки двигают фокус. Горизонт — ' + esc(yearsLabel(model.horizonYears)) + ", " + esc(weeksLabel(model.horizonWeeks)) + ".</p></div>";
    }

    function phoneLayout() {
      return window.innerWidth < 900;
    }

    function canvasMode() {
      return phoneLayout() && profile && profile.view === "life";
    }

    function blockEstimate(index) {
      if (gridState.measured[index]) return gridState.measured[index];
      var extra = 0;
      if (profile.showStages) {
        var stage = stageForYear(gridState.years[index]);
        var prev = index === 0 ? null : stageForYear(gridState.years[index - 1]);
        if (!prev || prev.id !== stage.id) extra = gridState.stageH;
      }
      return gridState.rowH + extra;
    }

    function offsetOf(index) {
      var sum = 0;
      for (var i = 0; i < index; i += 1) sum += blockEstimate(i);
      return sum;
    }

    function drawLife() {
      var canvas = document.getElementById("life-canvas");
      if (!canvas || !gridState.years.length) return;
      var styles = getComputedStyle(document.documentElement);
      var sand = styles.getPropertyValue("--sand").trim();
      var current = styles.getPropertyValue("--current").trim();
      var inkSoft = styles.getPropertyValue("--ink-soft").trim();
      var paper = styles.getPropertyValue("--paper").trim();
      var future = styles.getPropertyValue("--future").trim();
      var noteDot = styles.getPropertyValue("--note-dot").trim();
      var width = canvas.parentElement.clientWidth || 320;
      var labelW = 32;
      var rowH = 11;
      var stageH = 22;
      var years = gridState.years;
      var marks = [];
      var cursor = 0;
      for (var i = 0; i < years.length; i += 1) {
        var year = years[i];
        var stageLabel = "";
        if (profile.showStages) {
          var stage = stageForYear(year);
          var prev = i === 0 ? null : stageForYear(years[i - 1]);
          if (!prev || prev.id !== stage.id) {
            stageLabel = stage.label;
            cursor += stageH;
          }
        }
        marks.push({ year: year, y: cursor, h: rowH, stage: stageLabel, stageY: stageLabel ? cursor - stageH : 0 });
        cursor += rowH;
      }
      gridState.marks = marks;
      gridState.labelW = labelW;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.style.width = "100%";
      canvas.style.height = cursor + "px";
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(cursor * dpr);
      var ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, cursor);
      var cell = (width - labelW) / 52;
      gridState.cell = cell;
      for (var m = 0; m < marks.length; m += 1) {
        var mark = marks[m];
        if (mark.stage) {
          ctx.fillStyle = inkSoft;
          ctx.font = "italic 16px Georgia, serif";
          ctx.textAlign = "left";
          ctx.fillText(mark.stage, 0, mark.stageY + 16);
        }
        ctx.fillStyle = inkSoft;
        ctx.font = "10px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(String(mark.year), labelW - 4, mark.y + rowH - 2);
        for (var week = 0; week < 52; week += 1) {
          var index = mark.year * 52 + week;
          var state = stateOf(index, gridState.currentIndex);
          var noted = !!profile.notes[mark.year + "-" + week];
          var x = labelW + week * cell;
          ctx.globalAlpha = dimEmpty && !noted && state !== "current" ? 0.18 : 1;
          if (state === "future") {
            ctx.strokeStyle = future;
            ctx.strokeRect(x + 0.5, mark.y + 1, Math.max(1, cell - 1.5), rowH - 3);
          } else {
            ctx.fillStyle = state === "current" ? current : sand;
            ctx.fillRect(x, mark.y + 1, Math.max(1, cell - 1.5), rowH - 3);
          }
          if (noted) {
            ctx.fillStyle = state === "future" ? noteDot : paper;
            ctx.beginPath();
            ctx.arc(x + Math.max(1, cell - 1.5) / 2, mark.y + rowH / 2, 1.15, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }
      }
      if (!canvas.dataset.bound) {
        canvas.dataset.bound = "1";
        canvas.addEventListener("click", function (event) {
          var rect = canvas.getBoundingClientRect();
          var x = event.clientX - rect.left;
          var py = event.clientY - rect.top;
          var week = Math.floor((x - gridState.labelW) / gridState.cell);
          if (week < 0 || week > 51) return;
          var list = gridState.marks || [];
          for (var n = 0; n < list.length; n += 1) {
            if (py >= list[n].y && py < list[n].y + list[n].h) {
              openWeek(list[n].year, week);
              return;
            }
          }
        });
      }
    }

    function yearBlockHtml(position) {
      var year = gridState.years[position];
      var birth = gridState.birth;
      var currentIndex = gridState.currentIndex;
      var parts = ["<div class=\"year-block\">"];
      if (profile.showStages) {
        var stage = stageForYear(year);
        var prev = position === 0 ? null : stageForYear(gridState.years[position - 1]);
        if (!prev || prev.id !== stage.id) parts.push('<div class="stage-label">' + esc(stage.label) + "</div>");
      }
      var currentYear = currentIndex >= 0 && Math.floor(currentIndex / WEEKS) === year;
      parts.push('<div role="row" class="week-row' + (currentYear ? " is-now" : "") + '"><div class="year-label' + (year % 10 === 0 ? " is-decade" : "") + '">' + year + "</div>");
      for (var week = 0; week < WEEKS; week += 1) {
        var index = year * WEEKS + week;
        var state = stateOf(index, currentIndex);
        var noted = !!profile.notes[year + "-" + week];
        var range = weekRange(birth, index);
        parts.push('<button type="button" role="gridcell" id="week-' + year + "-" + week + '" class="week-cell is-' + state + (noted ? " has-note" : "") + (dimEmpty && !noted && state !== "current" ? " is-dim" : "") + (selected === index ? " is-selected" : "") + '" data-year="' + year + '" data-week="' + week + '" aria-label="' + year + ", неделя " + (week + 1) + ", " + stateLabel(state) + '"' + (state === "current" ? ' aria-current="date"' : "") + ' title="' + formatShort(range.start) + "–" + formatShort(range.end) + '"></button>');
      }
      parts.push("</div></div>");
      return parts.join("");
    }

    function syncGrid() {
      if (canvasMode()) return;
      var host = document.getElementById("grid-rows");
      var years = gridState.years;
      if (!host || !years.length) return;
      var total = years.length;
      var start = 0;
      var end = total;
      if (total > 16) {
        var cal = document.getElementById("calendar");
        var viewStart = 0;
        var viewSize = 700;
        if (phoneLayout()) {
          viewStart = Math.max(0, -cal.getBoundingClientRect().top);
          viewSize = window.innerHeight;
        } else {
          var scroller = document.getElementById("grid-scroll");
          viewStart = Math.max(0, scroller.scrollTop - cal.offsetTop);
          viewSize = scroller.clientHeight || 640;
        }
        var cursor = 0;
        while (start < total && cursor + blockEstimate(start) < viewStart - gridState.rowH * 5) {
          cursor += blockEstimate(start);
          start += 1;
        }
        end = start;
        var limit = viewStart + viewSize + gridState.rowH * 8;
        var walked = cursor;
        while (end < total && walked < limit) {
          walked += blockEstimate(end);
          end += 1;
        }
      }
      if (start !== gridState.start || end !== gridState.end) {
        var html = [];
        for (var i = start; i < end; i += 1) html.push(yearBlockHtml(i));
        host.innerHTML = html.join("");
        gridState.start = start;
        gridState.end = end;
      }
      var blocks = host.children;
      for (var b = 0; b < blocks.length; b += 1) {
        var height = blocks[b].getBoundingClientRect().height;
        if (height > 0) gridState.measured[start + b] = height;
      }
      var padTop = document.getElementById("grid-pad-top");
      var padBottom = document.getElementById("grid-pad-bottom");
      if (padTop) padTop.style.height = offsetOf(start) + "px";
      if (padBottom) padBottom.style.height = Math.max(0, offsetOf(total) - offsetOf(end)) + "px";
    }

    function scheduleGrid() {
      if (canvasMode()) return;
      if (gridState.ticking) return;
      gridState.ticking = true;
      requestAnimationFrame(function () {
        gridState.ticking = false;
        syncGrid();
      });
    }

    function revealYear(year) {
      if (canvasMode()) {
        var canvas = document.getElementById("life-canvas");
        var list = gridState.marks || [];
        var mark = null;
        for (var i = 0; i < list.length; i += 1) if (list[i].year === year) mark = list[i];
        if (canvas && mark) window.scrollTo(0, Math.max(0, canvas.getBoundingClientRect().top + window.scrollY + mark.y - 72));
        return;
      }
      var index = gridState.years.indexOf(year);
      var cal = document.getElementById("calendar");
      if (index < 0 || !cal) return;
      var y = offsetOf(index);
      if (phoneLayout()) window.scrollTo(0, Math.max(0, cal.getBoundingClientRect().top + window.scrollY + y - 72));
      else {
        var scroller = document.getElementById("grid-scroll");
        if (scroller) scroller.scrollTop = cal.offsetTop + Math.max(0, y - 24);
      }
      syncGrid();
    }

    function renderCalendar(reveal) {
      var model = modelOf(profile);
      var scroller = document.querySelector(".grid-scroll");
      var memory = !reveal && scroller ? { top: scroller.scrollTop, left: scroller.scrollLeft, win: window.scrollY } : null;
      var name = profile.name || "Календарь жизни";
      var maxDecade = Math.max(0, Math.floor((model.displayYears - 1) / 10) * 10);
      var decadeEnd = Math.min(model.displayYears - 1, decadeStart + 9);
      var decadeNav = profile.view === "decade"
        ? '<button type="button" class="btn small line" data-action="decade-prev" aria-label="Предыдущие десять лет"' + (decadeStart === 0 ? " disabled" : "") + '>←</button><span class="soft">' + decadeStart + "–" + decadeEnd + '</span><button type="button" class="btn small line" data-action="decade-next" aria-label="Следующие десять лет"' + (decadeStart >= maxDecade ? " disabled" : "") + '>→</button>'
        : "";
      var currentKey = "";
      if (model.currentInside) {
        var year = Math.floor(model.currentIndex / WEEKS);
        var week = model.currentIndex % WEEKS;
        currentKey = year + "-" + week;
      }
      var currentNote = currentKey && profile.notes[currentKey] ? profile.notes[currentKey].text : "";
      app.dataset.contemplation = contemplation ? "true" : "false";
      app.innerHTML = '<header class="top chrome"><div><p class="kicker">Недели жизни</p><h1 id="calendar-title">' + esc(name) + '</h1></div><div class="row"><button type="button" class="btn small line" data-action="journal">Журнал</button><button type="button" class="btn small line" data-action="settings">Настройки</button></div></header><div class="contemplation-only"><p class="quote">«' + QUOTE + '»</p><button type="button" class="btn small line" data-action="contemplation-off">Вернуться</button></div><div class="layout"><aside class="aside panel"><div>' + hourglass(model.pastRatio, model.futureRatio, model.futureWeeks > 0) + '</div>' + statsHtml(model) + '<p class="soft">' + esc(remainingPhrase(model.futureWeeks)) + '</p>' + (model.extended ? '<p class="soft">Сетка длиннее горизонта: уже прожитые годы остаются на месте.</p>' : '') + '<p class="quote" style="font-size:1.35rem">«' + QUOTE + '»</p>' + (currentNote ? '<p class="soft">' + esc(currentNote) + '</p>' : '<p class="faint">У текущей недели пока нет записи.</p>') + (saveWarning ? '<p class="error">' + esc(saveWarning) + '</p>' : '') + '</aside><section><div class="row toolbar chrome" style="margin-bottom:0.7rem"><button type="button" class="btn small line" data-action="view" data-view="life" aria-pressed="' + (profile.view === "life") + '">Вся жизнь</button><button type="button" class="btn small line" data-action="view" data-view="decade" aria-pressed="' + (profile.view === "decade") + '">Десятилетие</button>' + decadeNav + '<button type="button" class="btn small line" data-action="current">К этой неделе</button><button type="button" class="btn small ghost" data-action="stages" aria-pressed="' + profile.showStages + '">Этапы</button><button type="button" class="btn small ghost" data-action="dim" aria-pressed="' + dimEmpty + '">Только заметки</button><button type="button" class="btn small ghost" data-action="contemplation-on">Созерцание</button></div>' + gridHtml(model) + '</section></div>';
      var next = document.getElementById("grid-scroll");
      if (next) next.addEventListener("scroll", scheduleGrid, { passive: true });
      if (canvasMode()) {
        drawLife();
        if (reveal) scrollToCurrent();
        else if (memory) window.scrollTo(0, memory.win || 0);
      } else if (reveal) scrollToCurrent();
      else {
        if (memory && next) {
          next.scrollTop = memory.top;
          next.scrollLeft = memory.left;
        }
        if (memory) window.scrollTo(0, memory.win || 0);
        syncGrid();
      }
    }

    function scrollCell(cell) {
      var scroller = document.querySelector(".grid-scroll");
      if (!cell || !scroller) return;
      var cellBox = cell.getBoundingClientRect();
      var box = scroller.getBoundingClientRect();
      if (cellBox.left < box.left || cellBox.right > box.right) {
        scroller.scrollLeft += cellBox.left - box.left - (box.width - cellBox.width) / 2;
      }
      if (!phoneLayout() && (cellBox.top < box.top || cellBox.bottom > box.bottom)) {
        scroller.scrollTop += cellBox.top - box.top - (box.height - cellBox.height) / 2;
        syncGrid();
      }
    }

    function scrollToCurrent() {
      var model = modelOf(profile);
      if (model.currentIndex < 0) {
        if (!canvasMode()) syncGrid();
        return;
      }
      revealYear(Math.floor(model.currentIndex / WEEKS));
      if (!canvasMode()) scrollCell(document.querySelector(".week-cell.is-current"));
    }

    function finishDialog() {
      var save = document.querySelector("#dialog [data-action='save-note']");
      if (save) {
        saveNote(Number(save.dataset.year), Number(save.dataset.week));
        return;
      }
      if (document.getElementById("set-birth") && !applySettings()) return;
      closeDialog();
    }

    function closeDialog() {
      var dialog = document.getElementById("dialog");
      if (dialog) dialog.remove();
    }

    function openDialog(html) {
      closeDialog();
      var overlay = document.createElement("div");
      overlay.className = "overlay";
      overlay.id = "dialog";
      overlay.innerHTML = '<div class="dialog" role="dialog" aria-modal="true">' + html + '</div>';
      document.body.appendChild(overlay);
      var focus = overlay.querySelector("textarea, input, button");
      if (focus) focus.focus();
    }

    function openWeek(year, week) {
      var model = modelOf(profile);
      var index = year * WEEKS + week;
      selected = index;
      var cell = document.getElementById("week-" + year + "-" + week);
      document.querySelectorAll(".week-cell.is-selected").forEach(function (node) {
        node.classList.remove("is-selected");
      });
      if (cell) cell.classList.add("is-selected");
      var state = stateOf(index, model.currentIndex);
      var range = weekRange(model.birth, index);
      var note = profile.notes[year + "-" + week] || { text: "", tag: "" };
      var placeholder = state === "past" ? "Что важно помнить об этой неделе" : state === "current" ? "Чем вы наполните эту неделю" : "Намерение — если захотите его оставить";
      var tags = TAGS.map(function (tag) {
        return '<button type="button" class="btn small line" data-action="pick-tag" data-tag="' + tag.id + '" aria-pressed="' + (note.tag === tag.id) + '">' + tag.label + '</button>';
      }).join("");
      openDialog('<p class="kicker">' + esc(stateLabel(state)) + '</p><h2>Возраст ' + year + ', неделя ' + (week + 1) + '</h2><p class="soft">' + esc(formatRange(range.start, range.end)) + '</p><div class="field"><label for="note">Заметка</label><textarea id="note" maxlength="2000" placeholder="' + esc(placeholder) + '">' + esc(note.text || "") + '</textarea></div><div class="tags" style="margin:0.8rem 0">' + tags + '</div><div class="row"><button type="button" class="btn small" data-action="save-note" data-year="' + year + '" data-week="' + week + '">Сохранить</button><button type="button" class="btn small ghost" data-action="close-dialog">Закрыть</button></div>');
    }

    function chosenTag() {
      var pressed = document.querySelector('#dialog [data-action="pick-tag"][aria-pressed="true"]');
      return pressed ? pressed.dataset.tag : "";
    }

    function saveNote(year, week) {
      var text = document.getElementById("note");
      var value = text ? text.value.slice(0, 2000) : "";
      var tag = chosenTag();
      var key = year + "-" + week;
      if (!value.trim() && !tag) delete profile.notes[key];
      else profile.notes[key] = { text: value, tag: tag || undefined, updatedAt: new Date().toISOString() };
      persist();
      closeDialog();
      renderCalendar(false);
    }

    function openSettings() {
      var custom = PRESETS.indexOf(profile.horizonYears) === -1;
      var presets = PRESETS.map(function (years) {
        return '<button type="button" class="btn small line" data-action="set-horizon" data-years="' + years + '" aria-pressed="' + (!custom && profile.horizonYears === years) + '">' + years + '</button>';
      }).join("");
      openDialog('<h2>Настройки</h2><div class="field"><label for="set-name">Имя</label><input id="set-name" type="text" maxlength="40" value="' + esc(profile.name) + '"></div><div class="field" style="margin-top:0.8rem"><label for="set-birth">Дата рождения</label><input id="set-birth" type="date" max="' + toISODate(today()) + '" value="' + esc(profile.birthDate) + '"></div><div class="field" style="margin-top:0.8rem"><span>Горизонт</span><div class="row">' + presets + '</div><input id="set-horizon" type="number" min="1" max="120" step="1" value="' + profile.horizonYears + '" aria-label="Горизонт в годах"></div><div class="field" style="margin-top:0.8rem"><span>Тема</span><div class="themes">' + themeButtons(profile.theme) + '</div></div><p id="settings-error" class="error" role="alert"></p><p class="soft">Календарь хранится только на этом устройстве. Файл — способ забрать его с собой.</p><div class="row"><button type="button" class="btn small line" data-action="export">Выгрузить</button><button type="button" class="btn small line" data-action="import">Загрузить</button><input id="import-file" type="file" accept="application/json,.json" hidden><button type="button" class="btn small ghost" data-action="reset">Начать заново</button></div><p id="settings-notice" class="soft"></p><div class="row" style="margin-top:0.6rem"><button type="button" class="btn small" data-action="close-dialog">Готово</button></div>');
    }

    function applySettings() {
      var name = document.getElementById("set-name");
      var birth = document.getElementById("set-birth");
      var horizon = document.getElementById("set-horizon");
      var error = document.getElementById("settings-error");
      if (!birth || !horizon) return false;
      var birthError = validateBirth(birth.value, today());
      var years = Number(horizon.value);
      if (birthError || !Number.isInteger(years) || years < 1 || years > 120) {
        if (error) error.textContent = birthError || "Горизонт — целое число от 1 до 120.";
        return false;
      }
      var birthChanged = profile.birthDate !== birth.value;
      var horizonChanged = profile.horizonYears !== years;
      profile.name = name ? name.value.trim().slice(0, 40) : "";
      profile.birthDate = birth.value;
      profile.horizonYears = years;
      persist();
      if (birthChanged || horizonChanged) {
        decadeStart = decadeOfCurrent();
        renderCalendar(true);
      } else {
        var title = document.getElementById("calendar-title");
        if (title) title.textContent = profile.name || "Календарь жизни";
      }
      if (error) error.textContent = "";
      return true;
    }

    function downloadProfile() {
      var blob = new Blob([JSON.stringify(profile, null, 2)], { type: "application/json" });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "life-calendar.json";
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function openJournal() {
      openDialog('<h2>Журнал</h2><div class="field"><label for="search">Поиск</label><input id="search" type="search" placeholder="Слово из заметки или метка"></div><div id="journal" class="journal-list"></div><div class="row" style="margin-top:0.8rem"><button type="button" class="btn small" data-action="close-dialog">Закрыть</button></div>');
      renderJournal("");
    }

    function renderJournal(query) {
      var host = document.getElementById("journal");
      if (!host) return;
      var needle = query.trim().toLowerCase();
      var items = Object.keys(profile.notes).map(function (key) {
        var parts = key.split("-");
        return { year: Number(parts[0]), week: Number(parts[1]), note: profile.notes[key] };
      }).filter(function (item) {
        if (!needle) return true;
        var tag = TAGS.filter(function (entry) { return entry.id === item.note.tag; })[0];
        var hay = (item.note.text + " " + (tag ? tag.label : "")).toLowerCase();
        return hay.indexOf(needle) !== -1;
      }).sort(function (a, b) {
        return a.note.updatedAt < b.note.updatedAt ? 1 : -1;
      });
      host.innerHTML = "";
      if (!items.length) {
        host.innerHTML = '<p class="soft">Заметок пока нет. Откройте любую клетку.</p>';
        return;
      }
      var birth = parseISODate(profile.birthDate);
      items.forEach(function (item) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = "journal-item";
        button.dataset.action = "jump";
        button.dataset.year = String(item.year);
        button.dataset.week = String(item.week);
        var range = weekRange(birth, item.year * WEEKS + item.week);
        var title = document.createElement("b");
        title.textContent = "Возраст " + item.year + ", неделя " + (item.week + 1);
        var meta = document.createElement("span");
        meta.className = "faint";
        var tag = TAGS.filter(function (entry) { return entry.id === item.note.tag; })[0];
        meta.textContent = formatRange(range.start, range.end) + (tag ? " · " + tag.label : "");
        button.appendChild(title);
        button.appendChild(document.createElement("br"));
        button.appendChild(meta);
        if (item.note.text) {
          var text = document.createElement("span");
          text.textContent = item.note.text;
          button.appendChild(document.createElement("br"));
          button.appendChild(text);
        }
        host.appendChild(button);
      });
    }

    function jumpTo(year, week) {
      closeDialog();
      if (profile.view === "decade") decadeStart = Math.floor(year / 10) * 10;
      renderCalendar(false);
      revealYear(year);
      scrollCell(document.getElementById("week-" + year + "-" + week));
      openWeek(year, week);
    }

    document.addEventListener("click", function (event) {
      var target = event.target.closest("[data-action]");
      if (!target) {
        var cell = event.target.closest(".week-cell");
        if (cell) {
          openWeek(Number(cell.dataset.year), Number(cell.dataset.week));
          return;
        }
        if (event.target.id === "dialog") finishDialog();
        return;
      }
      var action = target.dataset.action;
      if (action === "open-form") showForm();
      else if (action === "back-invite") showInvite();
      else if (action === "horizon") {
        readDraftFromForm();
        draft.horizon = Number(target.dataset.years);
        showForm();
      } else if (action === "horizon-custom") {
        readDraftFromForm();
        if (PRESETS.indexOf(draft.horizon) !== -1) draft.horizon = 85;
        showForm();
      } else if (action === "theme") {
        var theme = target.dataset.theme;
        if (document.getElementById("setup")) {
          readDraftFromForm();
          draft.theme = theme;
          document.documentElement.setAttribute("data-theme", theme);
          showForm();
        } else if (profile) {
          profile.theme = theme;
          document.documentElement.setAttribute("data-theme", theme);
          persist();
          document.querySelectorAll('#dialog [data-action="theme"]').forEach(function (button) {
            button.setAttribute("aria-pressed", button.dataset.theme === theme ? "true" : "false");
          });
        }
      } else if (action === "view") {
        profile.view = target.dataset.view === "decade" ? "decade" : "life";
        if (profile.view === "decade") decadeStart = decadeOfCurrent();
        persist();
        renderCalendar(profile.view === "life");
      } else if (action === "decade-prev") {
        decadeStart = Math.max(0, decadeStart - 10);
        renderCalendar(false);
      } else if (action === "decade-next") {
        decadeStart += 10;
        renderCalendar(false);
      } else if (action === "current") {
        if (profile.view === "decade") decadeStart = decadeOfCurrent();
        renderCalendar(true);
      } else if (action === "stages") {
        profile.showStages = !profile.showStages;
        persist();
        renderCalendar(false);
      } else if (action === "dim") {
        dimEmpty = !dimEmpty;
        renderCalendar(false);
      } else if (action === "contemplation-on") {
        contemplation = true;
        renderCalendar(false);
        window.scrollTo(0, 0);
      } else if (action === "contemplation-off") {
        contemplation = false;
        renderCalendar(false);
      } else if (action === "settings") openSettings();
      else if (action === "journal") openJournal();
      else if (action === "close-dialog") finishDialog();
      else if (action === "set-horizon") {
        var input = document.getElementById("set-horizon");
        if (input) input.value = target.dataset.years;
        document.querySelectorAll('[data-action="set-horizon"]').forEach(function (button) {
          button.setAttribute("aria-pressed", button === target ? "true" : "false");
        });
        applySettings();
      } else if (action === "save-note") saveNote(Number(target.dataset.year), Number(target.dataset.week));
      else if (action === "pick-tag") {
        var on = target.getAttribute("aria-pressed") === "true";
        document.querySelectorAll('#dialog [data-action="pick-tag"]').forEach(function (button) {
          button.setAttribute("aria-pressed", "false");
        });
        if (!on) target.setAttribute("aria-pressed", "true");
      } else if (action === "export") downloadProfile();
      else if (action === "import") {
        var file = document.getElementById("import-file");
        if (file) file.click();
      } else if (action === "reset") {
        var notice = document.getElementById("settings-notice");
        if (target.dataset.confirm !== "yes") {
          target.dataset.confirm = "yes";
          target.textContent = "Точно стереть";
          if (notice) notice.textContent = "Заметки исчезнут из этого браузера. Файл выгрузки останется у вас.";
          return;
        }
        localStorage.removeItem(KEY);
        profile = null;
        closeDialog();
        document.documentElement.setAttribute("data-theme", "sand");
        showInvite();
      } else if (action === "jump") jumpTo(Number(target.dataset.year), Number(target.dataset.week));
    });

    document.addEventListener("input", function (event) {
      if (event.target.form && event.target.form.id === "setup") {
        readDraftFromForm();
        refreshLive();
      }
      if (event.target.id === "search") renderJournal(event.target.value);
    });

    document.addEventListener("submit", function (event) {
      if (event.target.id === "setup") {
        event.preventDefault();
        submitForm();
      }
    });

    document.addEventListener("change", function (event) {
      if (event.target.id === "import-file" && event.target.files && event.target.files[0]) {
        var file = event.target.files[0];
        event.target.value = "";
        var reader = new FileReader();
        reader.onload = function () {
          var notice = document.getElementById("settings-notice");
          try {
            var next = parseProfile(JSON.parse(String(reader.result)));
            if (!next) throw new Error("bad");
            profile = next;
            document.documentElement.setAttribute("data-theme", profile.theme);
            persist();
            closeDialog();
            decadeStart = decadeOfCurrent();
            renderCalendar(true);
          } catch (error) {
            if (notice) notice.textContent = "Этот файл не похож на календарь жизни.";
          }
        };
        reader.readAsText(file);
      }
      if (event.target.id === "set-birth" || event.target.id === "set-horizon" || event.target.id === "set-name") {
        applySettings();
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        if (document.getElementById("dialog")) finishDialog();
        else if (contemplation) {
          contemplation = false;
          renderCalendar(false);
        }
        return;
      }
      var target = event.target;
      if (!target.dataset || target.dataset.year == null) return;
      var year = Number(target.dataset.year);
      var week = Number(target.dataset.week);
      if (event.key === "ArrowRight") week += 1;
      else if (event.key === "ArrowLeft") week -= 1;
      else if (event.key === "ArrowDown") year += 1;
      else if (event.key === "ArrowUp") year -= 1;
      else return;
      if (week > 51) { week = 0; year += 1; }
      else if (week < 0) { week = 51; year -= 1; }
      var nextCell = document.getElementById("week-" + year + "-" + week);
      if (!nextCell) {
        revealYear(year);
        nextCell = document.getElementById("week-" + year + "-" + week);
      }
      if (!nextCell) return;
      event.preventDefault();
      nextCell.focus();
    });

    window.addEventListener("scroll", scheduleGrid, { passive: true });
    window.addEventListener("resize", function () {
      if (canvasMode()) {
        var grid = document.querySelector(".week-grid");
        if (grid) grid.classList.add("is-phone");
        drawLife();
        return;
      }
      var grid = document.querySelector(".week-grid");
      if (grid) grid.classList.remove("is-phone");
      gridState.measured = [];
      gridState.start = -1;
      gridState.end = -1;
      scheduleGrid();
    });

    if (profile) {
      document.documentElement.setAttribute("data-theme", profile.theme);
      decadeStart = decadeOfCurrent();
      renderCalendar(true);
    } else {
      showInvite();
    }
  </script>
</body>
</html>
